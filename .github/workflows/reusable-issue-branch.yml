name: Reusable Create Branch on Issue

on:
  workflow_call:
    inputs:
      max-slug-length:
        type: number
        default: 50

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create issue branch
        # Event data goes through env, never ${{ }} inside the script: an issue title is attacker-controlled text.
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          MAX_SLUG: ${{ inputs.max-slug-length }}
        run: |
          SLUG=$(printf '%s\n' "$TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-"$MAX_SLUG")

          BRANCH="${ISSUE_NUM}-${SLUG}"
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)

          echo "Creating branch: $BRANCH from $DEFAULT_BRANCH"
          git checkout -b "$BRANCH" "origin/$DEFAULT_BRANCH"
          git push origin "$BRANCH"
