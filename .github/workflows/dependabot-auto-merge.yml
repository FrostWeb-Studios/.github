name: Dependabot auto-merge

# Merge Dependabot minor/patch PRs automatically (org decision 2026-08-06;
# majors excluded since 2026-09-25, see below).
#
# History: the original version commented "@dependabot squash and merge",
# but Dependabot silently ignores command comments in this org — even from
# humans (no reaction, no reply; 2026-08-22 audit). Every PR that appeared
# to auto-merge had actually been merged by hand. So merge directly with
# LIVE_PROMOTE_PAT (org admin — bypasses the code-owner ruleset).
#
# pull_request_target runs in base-branch context: PR code is never checked
# out here, and org secrets are available even on Dependabot-actor events
# (plain pull_request would only get Dependabot-scoped secrets).

on: pull_request_target

# dependabot/fetch-metadata reads the PR commits through the API with GITHUB_TOKEN;
# on a private repo that needs pull-requests: read (it 403s under permissions: {}).
permissions:
  pull-requests: read

# 2026-09-25: majors are NOT auto-merged any more. Auto-merged major bumps
# have broken production three times org-wide (typescript 5->6 and
# @nestjs/platform-express 11->12 in identity-service; typescript 6->7 here
# made master unbuildable). Major PRs stay open for a human to review.

# 2026-10-12: merged through GitHub auto-merge instead of an immediate admin
# merge. The PR merges on its own once every check the org ruleset requires on
# master is green (ci.yml now runs on master PRs); the merge is performed as the
# org admin behind LIVE_PROMOTE_PAT, which the ruleset lets bypass the review
# requirement. Humans still need an approving review.

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # GitHub auto-merge does not use ruleset bypass: the PR must genuinely satisfy
      # the master rules. The org admin behind LIVE_PROMOTE_PAT is a maintainer of
      # both code-owner teams, so this review satisfies the review requirement;
      # auto-merge then waits for the required CI check and merges. Reviews are
      # dismissed when Dependabot rebases, and this job re-runs on synchronize.
      - name: Approve (minor/patch only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr review "$PR_URL" --approve --body "Dependabot minor/patch bump approved by the auto-merge workflow. Merges when CI is green."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.LIVE_PROMOTE_PAT }}
      - name: Merge when checks are green (minor/patch only)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.LIVE_PROMOTE_PAT }}
