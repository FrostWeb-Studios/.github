name: Reusable Dependency Review

# Skip the checkout entirely — dependency-review-action reads the PR
# diff via the GitHub API, not the working tree. That alone saves
# ~5-10s per run.
#
# The GHAS-required gate for private repos is enforced by
# `continue-on-error` keyed off the PR base repo visibility, which we
# read straight from the event payload (no extra gh api call).

on:
  workflow_call:
    inputs:
      fail-on-severity:
        type: string
        default: high
      allow-licenses:
        type: string
        default: ""

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        continue-on-error: ${{ github.event.pull_request.base.repo.visibility != 'public' }}
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allow-licenses }}
          comment-summary-in-pr: on-failure
